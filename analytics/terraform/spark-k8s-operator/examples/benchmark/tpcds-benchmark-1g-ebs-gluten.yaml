# > **Note:** Before running these jobs, make sure the following prerequisites are completed:

# 1. Set up an S3 bucket to store the generated data.
# 2. Update the `eks.tf` file to modify `min_size=6` and `desired_size=6` for the managed node group `"spark_benchmark_ebs"`, then run `terraform apply`.
# 3. Confirm that the `"spark-team-a"` namespace exists.
# 4. Replace `<S3_BUCKET>` in the configuration with your actual bucket name.
# 5. Run `kubectl apply -f <filename>` to apply the configuration.

# If you are repeating the tests to re-runw tih different instance types then make sure you update the following
# 1/ Joba name to match with instance type e.g., name: tpcds-benchmark-1tb-ebs-r6g

---
apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: tpcds-benchmark-1gb-ebs # Change for each test with instancetype etc,
  namespace: spark-team-a
spec:
  # Temporarily commented out until the YuniKorn issue is resolved; falls back to the default Kubernetes scheduler
  # batchScheduler: yunikorn
  # batchSchedulerOptions:
  #   queue: root.default
  type: Scala
  mode: cluster
  # image: public.ecr.aws/data-on-eks/spark3.5.3-scala2.12-java17-python3-ubuntu-tpcds:v2
  image: 724772074726.dkr.ecr.us-east-1.amazonaws.com/spark-gluten-tpcds:0701
  imagePullPolicy: IfNotPresent
  sparkVersion: 3.5.3
  mainClass: com.amazonaws.eks.tpcds.BenchmarkSQL
  mainApplicationFile: local:///opt/spark/examples/jars/eks-spark-benchmark-assembly-1.0.jar
  arguments:
    # TPC-DS data location
    - "s3a://kfz-tpcds-dataset/1g/warehouse/parquet"
    # results location
    - "s3a://kfz-tpcds-dataset/TPCDS-TEST-1G-RESULT"
    # Path to kit in the docker image
    - "/opt/tpcds-kit/tools"
    # Data Format
    - "parquet"
    # Scale factor (in GB)
    - "1" # changed from 3000 to 100gb for demo
    # Number of iterations
    - "1"
    # Optimize queries with hive tables
    - "false"
    # Filter queries, will run all if empty - "q98-v2.4,q99-v2.4,ss_max-v2.4,q95-v2.4"
    - "q1-v2.4"
    # Logging set to WARN
    - "true"
  sparkConf:
    # Expose Spark metrics for Prometheus
    "spark.ui.prometheus.enabled": "true"
    "spark.executor.processTreeMetrics.enabled": "true"
    "spark.metrics.conf.*.sink.prometheusServlet.class": "org.apache.spark.metrics.sink.PrometheusServlet"
    "spark.metrics.conf.driver.sink.prometheusServlet.path": "/metrics/driver/prometheus/"
    "spark.metrics.conf.executor.sink.prometheusServlet.path": "/metrics/executors/prometheus/"

    # Spark Event logs
    "spark.eventLog.enabled": "true"
    "spark.eventLog.dir": "s3a://spark-operator-doeks-spark-logs-20250409142902480900000001/spark-event-logs"
    "spark.eventLog.rolling.enabled": "true"
    "spark.eventLog.rolling.maxFileSize": "64m"

    "spark.network.timeout": "800s"
    "spark.sql.broadcastTimeout": "600"
    "spark.executor.heartbeatInterval": "300s"
    # AQE
    "spark.sql.adaptive.enabled": "true"
    "spark.sql.adaptive.localShuffleReader.enabled": "true"
    "spark.sql.adaptive.coalescePartitions.enabled": "true"
    "spark.sql.adaptive.skewJoin.enabled": "true"
    "spark.sql.adaptive.coalescePartitions.minPartitionNum": "4"
    "spark.kubernetes.executor.podNamePrefix": "benchmark-exec" #for karpenter
    # "spark.kubernetes.executor.podNamePrefix": "benchmark-exec-ebs" #for managed node group

   # S3 Optimizations
    # "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.WebIdentityTokenCredentialsProvider" # This is using AWS SDK V1 in maintenance mode
    "spark.hadoop.fs.s3a.aws.credentials.provider.mapping": "com.amazonaws.auth.WebIdentityTokenCredentialsProvider=software.amazon.awssdk.auth.credentials.WebIdentityTokenFileCredentialsProvider"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "software.amazon.awssdk.auth.credentials.WebIdentityTokenFileCredentialsProvider"  # AWS SDK V2 https://hadoop.apache.org/docs/stable/hadoop-aws/tools/hadoop-aws/aws_sdk_upgrade.html
    "spark.hadoop.fs.s3.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.fast.upload": "true"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.fast.upload.buffer": "disk"
    "spark.hadoop.fs.s3a.buffer.dir": "/tmp/s3a"
    "spark.hadoop.fs.s3a.multipart.size": "128M" # Good for large files
    "spark.hadoop.fs.s3a.multipart.threshold": "256M"
    "spark.hadoop.fs.s3a.threads.max": "50"
    "spark.hadoop.fs.s3a.connection.maximum": "200"

    "spark.hadoop.mapreduce.fileoutputcommitter.algorithm.version": "2"
    "spark.executor.defaultJavaOptions": "-verbose:gc -XX:+UseParallelGC -XX:InitiatingHeapOccupancyPercent=70"
    # "spark.hadoop.fs.s3a.readahead.range": "256K"

    # -----------------------------------------------------
    # This block is very critical when you get errors like
    #     Exception in thread \"main\" io.fabric8.kubernetes.client.KubernetesClientException: An error has occurred
    #     Caused by: java.net.SocketTimeoutException: timeout
    # spark.kubernetes.local.dirs.tmpfs: "true" # More details here https://spark.apache.org/docs/latest/running-on-kubernetes.html#using-ram-for-local-storage
    spark.kubernetes.submission.connectionTimeout: "120000" # milliseconds
    spark.kubernetes.submission.requestTimeout: "120000"
    spark.kubernetes.driver.connectionTimeout: "120000"
    spark.kubernetes.driver.requestTimeout: "120000"
    # spark.kubernetes.allocation.batch.size: "20" # default 5 but adjust according to your cluster size
    # -----------------------------------------------------
    # S3 Optimizations
    "spark.hadoop.fs.s3a.multipart.size": "104857600"           # 64 MB part size for S3 uploads
    "spark.hadoop.fs.s3a.threads.max": "20"             # Limit S3 threads for optimized throughput
    # Data writing and shuffle tuning
    # "spark.shuffle.file.buffer": "1m"                           # Increase shuffle buffer for better disk I/O
    # "spark.reducer.maxSizeInFlight": "48m"                      # Increase reducer buffer size in-flight data
    # # Optional: Tuning multipart upload threshold
    # "spark.hadoop.fs.s3a.multipart.purge": "true"               # Automatically clear failed multipart uploads
    # "spark.hadoop.fs.s3a.multipart.threshold": "134217728"      # 128 MB threshold to start multi-part upload
    
    # gluten
    "spark.driver.extraClassPath": "local:///opt/gluten/gluten-velox-bundle-spark3.5_2.12-linux_amd64-1.5.0-SNAPSHOT-java11.jar"
    "spark.executor.extraClassPath": "local:///opt/gluten/gluten-velox-bundle-spark3.5_2.12-linux_amd64-1.5.0-SNAPSHOT-java11.jar"
    # "spark.driver.extraClassPath": "local:///opt/gluten/gluten-velox-bundle-spark3.5_2.12-linux_aarch64-1.5.0-SNAPSHOT.jar"
    # "spark.executor.extraClassPath": "local:///opt/gluten/gluten-velox-bundle-spark3.5_2.12-linux_aarch64-1.5.0-SNAPSHOT.jar"
    "spark.plugins": "org.apache.gluten.GlutenPlugin"
    "spark.gluten.enabled": "true"
    "spark.gluten.sql.enable": "true"
    "spark.sql.extensions": "org.apache.gluten.extension.GlutenSessionExtensions"
    "spark.sql.autoBroadcastJoinThreshold": "-1"
    "spark.gluten.sql.columnar.backend.velox": "true"
    "spark.gluten.sql.columnar.backend.lib": "libvelox_jni.so"
    "spark.gluten.sql.columnar.filescan.enabled": "false"
    "spark.gluten.sql.columnar.broadcastExchange.enabled": "false"
    "spark.gluten.sql.columnar.broadcastHashJoin.enabled": "false"
    "spark.gluten.sql.columnar.writeFiles.enabled": "false"
    #"spark.gluten.sql.columnar.backend.velox.bloomFilter.enabled": "false"
    # Disable other potentially problematic operations
    "spark.gluten.sql.columnar.shuffledHashJoin.enabled": "false"  # Shuffle joins initially
    "spark.gluten.sql.columnar.sortMergeJoin.enabled": "true"      # Keep sort-merge joins
    "spark.gluten.sql.columnar.window.enabled": "true"            # Keep window functions
    "spark.gluten.sql.columnar.wholestagecodegen.enabled": "true" # Keep codegen
    # Force validation to ensure fallbacks work
    "spark.gluten.sql.enable.native.validation": "false"

    # "spark.gluten.memory.task.offHeap.size.in.bytes": "2147483648"
    "spark.gluten.sql.debug": "true"
    "spark.gluten.sql.validation.logLevel": "DEBUG"
    "spark.gluten.memory.debug": "true"
    "spark.gluten.sql.columnar.backend.velox.glog.v": "3"
    "spark.gluten.sql.columnar.backend.velox.glog.minloglevel": "0"
    "spark.gluten.sql.columnar.backend.velox.glog.stderrthreshold": "0"
    "spark.gluten.sql.columnar.backend.velox.glog.alsologtostderr": "true"

    # Memory settings
    "spark.memory.offHeap.enabled": "true"
    "spark.memory.offHeap.size": "6g"

    # Critical fallback settings - UPDATED
    "spark.gluten.sql.columnar.skipUnsupportedOperator": "true"
    "spark.gluten.sql.columnar.forceFallback": "false"
    "spark.gluten.sql.columnar.fallbackPolicy": "exception"  
    "spark.gluten.sql.columnar.exchange.forceFallback": "true"  
    "spark.sql.adaptive.enabled": "false"  

    # Performance optimizations
    # "spark.gluten.sql.columnar.iterator.enableJemalloc": "true"
    # "spark.gluten.sql.columnar.forceShuffle": "true"
    # "spark.gluten.sql.enable.vectorized.hash.map": "true"
    # "spark.gluten.sql.columnar.backend.ch.transferBufferSize": "4194304"
    # "spark.gluten.sql.columnar.forceShuffledHashJoin": "false"
    # "spark.gluten.sql.columnar.hashagg.enableTwoLevel": "true"
    
    # Batch size optimizations
    # "spark.sql.parquet.columnarReaderBatchSize": "4096"
    # "spark.sql.inMemoryColumnarStorage.batchSize": "4096"
    # "spark.sql.execution.arrow.maxRecordsPerBatch": "4096"

  driver:
    cores: 12
    memory: "24g"
    memoryOverhead: "8g"
    serviceAccount: spark-team-a
    securityContext:
      runAsUser: 185
    env:
      - name: JAVA_HOME
        value: "/opt/java/openjdk"
    nodeSelector:
      # NodeGroupType: "SparkGravitonMemoryOptimized"
      NodeGroupType: SparkComputeOptimized #for karpenter SparkComputeOptimized|SparkMemoryOptimized
  executor:
    cores: 4
    memory: "24g"
    memoryOverhead: "8g"
    instances: 4
    serviceAccount: spark-team-a
    securityContext:
      runAsUser: 185
    env:
      - name: JAVA_HOME
        value: "/opt/java/openjdk"
    nodeSelector:
      # NodeGroupType: "SparkGravitonMemoryOptimized"
      NodeGroupType: SparkMemoryOptimized #for karpenter SparkComputeOptimized|SparkMemoryOptimized
  restartPolicy:
    type: Never
