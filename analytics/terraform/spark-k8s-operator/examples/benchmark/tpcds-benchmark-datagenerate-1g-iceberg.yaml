apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: iceberg-generate-1g
  namespace: spark-team-a
spec:
  type: Python
  sparkVersion: "3.5.3"
  mode: cluster
  image: "public.ecr.aws/data-on-eks/spark:3.5.3-scala2.12-java17-python3-ubuntu-s3table0.1.3-iceberg1.6.1"
  mainApplicationFile: "s3a://kfz-tpcds-dataset/writeIceberg.py"
  arguments:
    - "--source-dir=s3a://kfz-tpcds-dataset/1g/warehouse/parquet/"
    - "--target-dir=s3a://kfz-tpcds-dataset/1g/icetest/"
    - "--database_name=ice1g"
  sparkConf:
    "spark.app.name": "iceberg-generate-1g"
    "spark.kubernetes.driver.pod.name": "iceberg-generate-1g"
    "spark.kubernetes.executor.podNamePrefix": "iceberg-generate-1g"
    "spark.local.dir": "/data"
    "spark.speculation": "false"
    "spark.network.timeout": "2400"
    "spark.hadoop.fs.s3a.connection.timeout": "1200000"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.connection.maximum": "200"
    "spark.hadoop.fs.s3a.fast.upload": "true"
    "spark.hadoop.fs.s3a.readahead.range": "256K"
    "spark.hadoop.fs.s3a.input.fadvise": "random"
    "spark.hadoop.fs.s3a.aws.credentials.provider.mapping": "com.amazonaws.auth.WebIdentityTokenCredentialsProvider=software.amazon.awssdk.auth.credentials.WebIdentityTokenFileCredentialsProvider"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "software.amazon.awssdk.auth.credentials.WebIdentityTokenFileCredentialsProvider" # AWS SDK V2 https://hadoop.apache.org/docs/stable/hadoop-aws/tools/hadoop-aws/aws_sdk_upgrade.html

  restartPolicy:
    type: OnFailure
    onFailureRetries: 1

  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "4g"
    serviceAccount: spark-team-a
    nodeSelector:
      NodeGroupType: "SparkComputeOptimized"
      karpenter.sh/capacity-type: "on-demand"

  executor:
    cores: 1
    coreLimit: "1200m"
    instances: 1
    memory: "4g"
    serviceAccount: spark-team-a
    nodeSelector:
      NodeGroupType: "SparkComputeOptimized"
