apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: iceberg-generate-1t
  namespace: spark-team-a
spec:
  type: Python
  sparkVersion: "3.5.3"
  mode: cluster
  image: "public.ecr.aws/data-on-eks/spark:3.5.3-scala2.12-java17-python3-ubuntu-s3table0.1.3-iceberg1.6.1"
  mainApplicationFile: "s3a://kfz-tpcds-dataset/writeIceberg.py"
  arguments:
    - "--source-dir=s3a://spark-operator-doeks-spark-logs-20250219081011868600000007/TPCDS-TEST-1TB-30krec/"
    - "--target-dir=s3a://kfz-tpcds-dataset/1t/iceberg-30k/"
    - "--database_name=ice1t500k"
  sparkConf:
    "spark.app.name": "iceberg-generate-1t"
    "spark.kubernetes.driver.pod.name": "iceberg-generate-1t"
    "spark.kubernetes.executor.podNamePrefix": "iceberg-generate-1t"
    "spark.local.dir": "/data"
    "spark.speculation": "false"
    "spark.network.timeout": "2400"
    "spark.hadoop.fs.s3a.connection.timeout": "1200000"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.connection.maximum": "200"
    "spark.hadoop.fs.s3a.fast.upload": "true"
    "spark.hadoop.fs.s3a.readahead.range": "256K"
    "spark.hadoop.fs.s3a.input.fadvise": "random"
    "spark.hadoop.fs.s3a.aws.credentials.provider.mapping": "com.amazonaws.auth.WebIdentityTokenCredentialsProvider=software.amazon.awssdk.auth.credentials.WebIdentityTokenFileCredentialsProvider"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "software.amazon.awssdk.auth.credentials.WebIdentityTokenFileCredentialsProvider" # AWS SDK V2 https://hadoop.apache.org/docs/stable/hadoop-aws/tools/hadoop-aws/aws_sdk_upgrade.html

  restartPolicy:
    type: OnFailure
    onFailureRetries: 1

  driver:
    cores: 4
    # The maximum memory size of the container to the running executor is determined by the sum of
    #  spark.executor.memoryoverHead, spark.executor.memory, spark.memory.offHeap.size, spark.executor.pyspark.memory
    memory: "15g"
    memoryOverhead: "4g"
    serviceAccount: spark-team-a
    securityContext:
      runAsUser: 185
    volumeMounts:
    - name: spark-local-dir-1
      mountPath: /data1
    env:
    - name: JAVA_HOME
      value: "/opt/java/openjdk"
    initContainers:
    - name: volume-permission
      image: public.ecr.aws/docker/library/busybox
      command: ['sh', '-c', 'mkdir -p /data1; chown -R 185:185 /data1']
      volumeMounts:
      - name: spark-local-dir-1
        mountPath: /data1
    nodeSelector:
      NodeGroupType: spark_benchmark_ssd
  executor:
    cores: 11
    # The maximum memory size of the container to the running executor is determined by the sum of
    #  spark.executor.memoryoverHead, spark.executor.memory, spark.memory.offHeap.size, spark.executor.pyspark.memory
    memory: "15g"
    memoryOverhead: "4g"
    instances: 22
    serviceAccount: spark-team-a
    securityContext:
      runAsUser: 185
    volumeMounts:
    - name: spark-local-dir-1
      mountPath: /data1
    initContainers:
    - name: volume-permission
      image: public.ecr.aws/docker/library/busybox
      command: ['sh', '-c', 'mkdir -p /data1; chown -R 185:185 /data1']
      volumeMounts:
      - name: spark-local-dir-1
        mountPath: /data1
    env:
    - name: JAVA_HOME
      value: "/opt/java/openjdk"
    nodeSelector:
      NodeGroupType: spark_benchmark_ssd
  volumes:
  - name: spark-local-dir-1
    hostPath:
      path: "/mnt/k8s-disks/0"
      type: DirectoryOrCreate
