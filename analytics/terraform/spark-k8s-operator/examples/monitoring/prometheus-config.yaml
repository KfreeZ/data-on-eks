apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-spark-config
  namespace: spark-team-a
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'spark-cluster'
        
    rule_files:
      - "spark_rules.yml"
      
    scrape_configs:
      # Scrape Spark driver metrics
      - job_name: 'spark-driver'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - spark-team-a
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_spark_role]
            action: keep
            regex: driver
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
        scrape_interval: 10s
        metrics_path: /metrics/driver/prometheus/
        
      # Scrape Spark executor metrics
      - job_name: 'spark-executor'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - spark-team-a
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_spark_role]
            action: keep
            regex: executor
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
        scrape_interval: 10s
        metrics_path: /metrics/executors/prometheus/
        
      # Scrape node metrics
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics
            
      # Scrape cAdvisor for container metrics
      - job_name: 'kubernetes-cadvisor'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
            
    remote_write:
      - url: "http://prometheus-remote-storage:9201/write"
        queue_config:
          max_samples_per_send: 1000
          max_shards: 200
          capacity: 2500